# TYPE  DATABASE   USER            ADDRESS    METHOD
# 管理者はコンテナ内のUNIXソケットからのみ（ネットワーク経由のログインは不可）
local   all        postgres                   peer
# 学習者用の読み取り専用ロールのみ、Docker内部ネットワークから接続可（ホストには公開しない）
host    dsdojo_db  knocks_learner  all        scram-sha-256
# それ以外はすべて拒否
local   all        all                        reject
host    all        all             all        reject
