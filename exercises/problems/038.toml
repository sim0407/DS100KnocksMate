[sql]
strategy = "table"
rows = "subset_n"
n = 10
column_names = false
note = "列名は問いません。顧客ID・売上金額合計の順に出力してください。"
reference = '''
WITH customer_amount AS (
    SELECT customer_id, SUM(amount) AS sum_amount FROM receipt GROUP BY customer_id
),
customer_data AS (
    SELECT customer_id FROM customer WHERE gender_cd = '1' AND customer_id NOT LIKE 'Z%'
)
SELECT c.customer_id, COALESCE(a.sum_amount, 0)
FROM customer_data c
LEFT OUTER JOIN customer_amount a ON c.customer_id = a.customer_id
'''
