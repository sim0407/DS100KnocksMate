[sql]
strategy = "table"
rows = "unordered"
column_names = false
writable = true
note = "列名は問いません。年代・性別コード（'00'/'01'/'99'）・売上金額の3列で出力してください。売上がない組み合わせ（NULL）の行は含めても除いても正解とします。"
setup_note = "043 の売上サマリ sales_summary テーブル（列: era, male, female, unknown）を用意済みです。"
setup = '''
DROP TABLE IF EXISTS sales_summary;
CREATE TABLE sales_summary AS
    WITH gender_era_amount AS (
        SELECT TRUNC(age / 10) * 10 AS era, c.gender_cd, SUM(r.amount) AS amount
        FROM customer c JOIN receipt r ON c.customer_id = r.customer_id
        GROUP BY era, c.gender_cd
    )
    SELECT
        era,
        SUM(CASE WHEN gender_cd = '0' THEN amount END) AS male,
        SUM(CASE WHEN gender_cd = '1' THEN amount END) AS female,
        SUM(CASE WHEN gender_cd = '9' THEN amount END) AS unknown
    FROM gender_era_amount
    GROUP BY era
'''
reference = '''
SELECT era, '00' AS gender_cd, male AS amount FROM sales_summary
UNION ALL
SELECT era, '01' AS gender_cd, female AS amount FROM sales_summary
UNION ALL
SELECT era, '99' AS gender_cd, unknown AS amount FROM sales_summary
'''
alternatives = [
    '''
SELECT * FROM (
    SELECT era, '00' AS gender_cd, male AS amount FROM sales_summary
    UNION ALL
    SELECT era, '01' AS gender_cd, female AS amount FROM sales_summary
    UNION ALL
    SELECT era, '99' AS gender_cd, unknown AS amount FROM sales_summary
) t WHERE amount IS NOT NULL
''',
]
