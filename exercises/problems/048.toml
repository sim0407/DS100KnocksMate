[sql]
strategy = "table"
rows = "subset_n"
n = 10
column_names = false
note = "列名は問いません。レシート番号・レシートサブ番号・売上日（日付型）の順に出力してください。"
reference = 'SELECT receipt_no, receipt_sub_no, CAST(TO_TIMESTAMP(sales_epoch) AS DATE) AS sales_ymd FROM receipt'
