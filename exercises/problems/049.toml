[sql]
strategy = "table"
rows = "subset_n"
n = 10
column_names = false
note = "列名は問いません。レシート番号・レシートサブ番号・年の順に出力してください。"
reference = 'SELECT receipt_no, receipt_sub_no, EXTRACT(YEAR FROM TO_TIMESTAMP(sales_epoch)) AS sales_year FROM receipt'
