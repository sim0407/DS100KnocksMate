# P-051 / S-051: 売上エポック秒から「日」を0埋め2桁の文字列で取り出して10件
id = "051"
status = "verified"

[python]
strategy = "table"
rows = "subset_n"
n = 10
column_names = false
note = "列名は問いません。レシート番号・レシートサブ番号・日（0埋め2桁の文字列）の順に出力してください。"
reference = '''
pd.concat(
    [
        df_receipt[["receipt_no", "receipt_sub_no"]],
        pd.to_datetime(df_receipt["sales_epoch"], unit="s").dt.strftime("%d").rename("sales_day"),
    ],
    axis=1,
)
'''

[sql]
strategy = "table"
rows = "subset_n"
n = 10
column_names = false
note = "列名は問いません。レシート番号・レシートサブ番号・日（0埋め2桁の文字列）の順に出力してください。"
reference = '''
SELECT receipt_no, receipt_sub_no, TO_CHAR(EXTRACT(DAY FROM TO_TIMESTAMP(sales_epoch)), 'FM00') AS sales_day FROM receipt
'''
