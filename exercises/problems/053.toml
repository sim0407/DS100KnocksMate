[sql]
strategy = "table"
rows = "unordered"
column_names = false
note = "列名は問いません。二値（0/1）・顧客数の順に出力してください。"
reference = '''
WITH cust AS (
    SELECT
        customer_id,
        CASE WHEN CAST(SUBSTR(postal_cd, 1, 3) AS INTEGER) BETWEEN 100 AND 209 THEN 1 ELSE 0 END
            AS postal_flg
    FROM customer
)
SELECT c.postal_flg, COUNT(DISTINCT c.customer_id) AS customer_cnt
FROM cust c
JOIN (SELECT DISTINCT customer_id FROM receipt) r USING (customer_id)
GROUP BY c.postal_flg
'''
