[sql]
strategy = "table"
rows = "subset_n"
n = 10
column_names = false
note = "列名は問いません。顧客ID・売上金額合計・カテゴリ値（1〜4）の順に出力してください。"
reference = '''
WITH sales_amount AS (
    SELECT customer_id, SUM(amount) AS sum_amount FROM receipt GROUP BY customer_id
),
sales_pct AS (
    SELECT
        PERCENTILE_CONT(0.25) WITHIN GROUP (ORDER BY sum_amount) AS pct25,
        PERCENTILE_CONT(0.50) WITHIN GROUP (ORDER BY sum_amount) AS pct50,
        PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY sum_amount) AS pct75
    FROM sales_amount
)
SELECT
    a.customer_id,
    a.sum_amount,
    CASE
        WHEN a.sum_amount < pct25 THEN 1
        WHEN a.sum_amount < pct50 THEN 2
        WHEN a.sum_amount < pct75 THEN 3
        ELSE 4
    END AS pct_group
FROM sales_amount a CROSS JOIN sales_pct p
'''
