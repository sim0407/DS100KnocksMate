# P-062 / S-062: 会員の売上金額合計を自然対数化（底e）して10件（0対策の +0.5 はあってもなくても許容）
id = "062"
status = "verified"

[python]
strategy = "table"
rows = "subset_n"
n = 10
column_names = false
note = "列名は問いません。顧客ID・売上金額合計・対数化した値の順に出力してください。0への対策として +0.5 してから対数化しても正解とします。"
reference = '''
df_sales_amount = (
    df_receipt.query('not customer_id.str.startswith("Z")', engine="python")
    .groupby("customer_id")
    .agg({"amount": "sum"})
    .reset_index()
)
df_sales_amount["log_amount"] = np.log(df_sales_amount["amount"])
df_sales_amount
'''
alternatives = [
    '''
