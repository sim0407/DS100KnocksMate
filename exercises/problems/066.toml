column_names = false
note = "列名は問いません。商品コード・単価・原価・新しい単価・新しい利益率の5列をこの順に出力してください。丸めは四捨五入・偶数への丸めのどちらでも正解とします。"
reference = '''
WITH new_price_tbl AS (
    SELECT product_cd, unit_price, unit_cost, ROUND(unit_cost / 0.7) AS new_price FROM product
)
SELECT *, (new_price - unit_cost) / new_price AS new_profit_rate FROM new_price_tbl
