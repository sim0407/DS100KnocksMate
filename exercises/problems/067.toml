[sql]
strategy = "table"
rows = "subset_n"
n = 10
column_names = false
note = "列名は問いません。商品コード・単価・原価・新しい単価・新しい利益率の5列をこの順に出力してください。"
reference = '''
WITH new_price_tbl AS (
    SELECT product_cd, unit_price, unit_cost, CEIL(unit_cost / 0.7) AS new_price FROM product
)
SELECT *, (new_price - unit_cost) / new_price AS new_profit_rate FROM new_price_tbl
'''
