# P-067 / S-067: 利益率30%の新単価（1円未満切り上げ）を10件
id = "067"
status = "verified"

[python]
strategy = "table"
rows = "subset_n"
n = 10
column_names = false
note = "列名は問いません。商品コード・単価・原価・新しい単価・新しい利益率の5列をこの順に出力してください。"
reference = '''
df_tmp = df_product[["product_cd", "unit_price", "unit_cost"]].copy()
df_tmp["new_price"] = np.ceil(df_tmp["unit_cost"] / 0.7)
df_tmp["new_profit_rate"] = (df_tmp["new_price"] - df_tmp["unit_cost"]) / df_tmp["new_price"]
df_tmp
'''
