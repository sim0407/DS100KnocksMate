[sql]
strategy = "table"
rows = "subset_n"
n = 10
column_names = false
note = "列名は問いません。商品コード・単価・税込金額の順に出力してください。"
reference = 'SELECT product_cd, unit_price, TRUNC(unit_price * 1.1) AS tax_price FROM product'
