'''

[sql]
strategy = "table"
rows = "subset_n"
n = 10
column_names = false
note = "列名は問いません。顧客ID・全商品の売上金額合計・07の売上金額合計・比率の順に出力してください。"
reference = '''
WITH amount_all AS (
    SELECT customer_id, SUM(amount) AS sum_all FROM receipt GROUP BY customer_id
),
amount_07 AS (
    SELECT r.customer_id, SUM(r.amount) AS sum_07
    FROM receipt r JOIN product p ON r.product_cd = p.product_cd
    WHERE p.category_major_cd = '07'
    GROUP BY r.customer_id
)
SELECT a.customer_id, sum_all, sum_07, sum_07 * 1.0 / sum_all AS sales_rate
FROM amount_all a JOIN amount_07 b ON a.customer_id = b.customer_id
'''
