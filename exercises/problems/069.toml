# P-069 / S-069: 顧客ごとの全商品と瓶詰缶詰（07）の売上金額合計と比率を10件
id = "069"
status = "verified"

[python]
strategy = "table"
rows = "subset_n"
n = 10
column_names = false
note = "列名は問いません。顧客ID・全商品の売上金額合計・07の売上金額合計・比率の順に出力してください。"
reference = '''
df_tmp_1 = df_receipt.groupby("customer_id").agg({"amount": "sum"}).reset_index().rename(
    columns={"amount": "sum_all"}
)
df_tmp_2 = (
    pd.merge(df_receipt, df_product.query('category_major_cd == "07"'), how="inner", on="product_cd")
    .groupby("customer_id")
    .agg({"amount": "sum"})
