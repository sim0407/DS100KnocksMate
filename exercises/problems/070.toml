[sql]
strategy = "table"
rows = "subset_n"
n = 10
column_names = false
note = "列名は問いません。顧客ID・売上日・会員申込日・経過日数の4列をこの順に出力してください。売上日・申込日は元の形でも日付型に変換していても、同じ売上日の重複を除いていてもいなくても正解とします。"
reference = '''
SELECT c.customer_id, r.sales_ymd, c.application_date,
    EXTRACT(DAY FROM (TO_TIMESTAMP(CAST(r.sales_ymd AS VARCHAR), 'YYYYMMDD') - TO_TIMESTAMP(c.application_date, 'YYYYMMDD'))) AS elapsed
FROM (SELECT DISTINCT customer_id, sales_ymd FROM receipt) r JOIN customer c ON r.customer_id = c.customer_id
'''
alternatives = [
