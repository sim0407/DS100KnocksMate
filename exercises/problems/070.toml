# P-070 / S-070: 売上日と会員申込日から経過日数を計算して10件
id = "070"
status = "verified"

[python]
strategy = "table"
rows = "subset_n"
n = 10
column_names = false
note = "列名は問いません。顧客ID・売上日・会員申込日・経過日数の4列をこの順に出力してください。売上日・申込日は元の形でも日付型に変換していても、同じ売上日の重複を除いていてもいなくても正解とします。"
reference = '''
df_tmp = df_receipt[["customer_id", "sales_ymd"]].drop_duplicates()
df_tmp = pd.merge(df_tmp, df_customer[["customer_id", "application_date"]], how="inner", on="customer_id")

sales = pd.to_datetime(df_tmp["sales_ymd"].astype("str"))
applied = pd.to_datetime(df_tmp["application_date"])
df_tmp["elapsed_days"] = (sales - applied).dt.days
df_tmp
'''
