[sql]
strategy = "table"
rows = "subset_n"
n = 10
column_names = false
key_columns = 2
note = "顧客ID・売上金額合計を先頭の2列に出力してください（3列目以降は自由）。対数の底（自然対数/常用対数）、+0.5 の有無、標準偏差の種類（母集団/標本）は問いません。"
reference = '''
WITH sales_amount AS (
    SELECT customer_id, SUM(amount) AS sum_amount, LN(SUM(amount) + 0.5) AS log_sum_amount
    FROM receipt GROUP BY customer_id
)
SELECT customer_id, sum_amount
FROM sales_amount
CROSS JOIN (SELECT AVG(log_sum_amount) AS m, STDDEV_POP(log_sum_amount) AS s FROM sales_amount) stats
WHERE ABS(log_sum_amount - m) / s > 3
'''
