    FROM product
    CROSS JOIN (SELECT ROUND(CAST(AVG(unit_price) AS DOUBLE PRECISION)) AS unit_fill, ROUND(CAST(AVG(unit_cost) AS DOUBLE PRECISION)) AS cost_fill FROM product) stats
