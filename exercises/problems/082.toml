[sql]
strategy = "table"
rows = "unordered"
writable = true
artifacts = [
    'product_3',
]
note = "作成した商品データをテーブル product_3 にしてください（このテーブルを採点します。実行後に取り消されます）。1円未満の丸めは四捨五入・偶数への丸めのどちらでも正解とします。補完後の欠損数の確認は採点しません。"
reference = '''
CREATE TABLE product_3 AS (
    SELECT
        product_cd, category_major_cd, category_medium_cd, category_small_cd,
        COALESCE(unit_price, unit_fill) AS unit_price,
        COALESCE(unit_cost, cost_fill) AS unit_cost
    FROM product
    CROSS JOIN (SELECT ROUND(PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY unit_price)) AS unit_fill, ROUND(PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY unit_cost)) AS cost_fill FROM product) stats
)
'''
alternatives = [
    '''
CREATE TABLE product_3 AS (
    SELECT
        product_cd, category_major_cd, category_medium_cd, category_small_cd,
        COALESCE(unit_price, unit_fill) AS unit_price,
        COALESCE(unit_cost, cost_fill) AS unit_cost
    FROM product
    CROSS JOIN (SELECT ROUND(CAST(PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY unit_price) AS NUMERIC)) AS unit_fill, ROUND(CAST(PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY unit_cost) AS NUMERIC)) AS cost_fill FROM product) stats
)
