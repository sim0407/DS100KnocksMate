[sql]
strategy = "table"
rows = "unordered"
column_order = false
writable = true
artifacts = [
    'product_4',
]
note = "作成した商品データをテーブル product_4 にしてください（このテーブルを採点します。実行後に取り消されます）。1円未満の丸めは四捨五入・偶数への丸めのどちらでも正解とします。補完後の欠損数の確認は採点しません。（Python は中央値の列 median_price・median_cost を末尾に残していても正解とします）"
reference = '''
CREATE TABLE product_4 AS (
    WITH category_median AS (
        SELECT category_small_cd, ROUND(PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY unit_price)) AS unit_med, ROUND(PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY unit_cost)) AS cost_med
        FROM product GROUP BY category_small_cd
    )
    SELECT
        product_cd, category_major_cd, category_medium_cd, category_small_cd,
        COALESCE(unit_price, unit_med) AS unit_price,
        COALESCE(unit_cost, cost_med) AS unit_cost
    FROM product JOIN category_median USING (category_small_cd)
)
'''
