note = "作成したデータをテーブル sales_rate にしてください（実行後に取り消されます）。列名は問いません。顧客ID・2019年の売上金額合計・全期間の売上金額合計・割合の4列で、全顧客について作成してください。0超の抽出・10件表示・欠損の確認は採点しません。"
reference = '''
CREATE TABLE sales_rate AS (
    WITH a2019 AS (
        SELECT customer_id, SUM(amount) AS s FROM receipt WHERE sales_ymd BETWEEN 20190101 AND 20191231 GROUP BY customer_id
    ),
    a_all AS (SELECT customer_id, SUM(amount) AS s FROM receipt GROUP BY customer_id)
    SELECT c.customer_id, COALESCE(b.s, 0) AS s2019, COALESCE(d.s, 0) AS sall,
        CASE COALESCE(d.s, 0) WHEN 0 THEN 0 ELSE COALESCE(b.s, 0) * 1.0 / d.s END AS sales_rate
    FROM customer c LEFT JOIN a2019 b ON c.customer_id = b.customer_id LEFT JOIN a_all d ON c.customer_id = d.customer_id
)
'''
