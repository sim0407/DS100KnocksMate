[sql]
strategy = "table"
rows = "subset_n"
n = 10
column_names = false
writable = true
note = "列名は問いません。顧客データの全項目と経度の平均・緯度の平均を出力してください（USING(postal_cd) で結合した列順、または顧客の全項目→経度→緯度の列順）。"
reference = '''
CREATE TABLE customer_1 AS (
    WITH geocode_avg AS (
        SELECT postal_cd, AVG(longitude) AS m_longitude, AVG(latitude) AS m_latitude FROM geocode GROUP BY postal_cd
    )
    SELECT * FROM customer c JOIN geocode_avg g USING (postal_cd)
)
;
SELECT * FROM customer_1
'''
alternatives = [
    '''
WITH geocode_avg AS (
    SELECT postal_cd, AVG(longitude) AS m_longitude, AVG(latitude) AS m_latitude FROM geocode GROUP BY postal_cd
)
SELECT c.*, g.m_longitude, g.m_latitude FROM customer c JOIN geocode_avg g ON c.postal_cd = g.postal_cd
''',
]
