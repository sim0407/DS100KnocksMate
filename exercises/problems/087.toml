[sql]
strategy = "table"
rows = "unordered"
writable = true
artifacts = [
    'customer_u',
]
note = "名寄顧客データをテーブル customer_u にしてください（088 で使います。実行後に取り消されます）。顧客データの全項目（売上金額合計 sum_amount を末尾に残しても可）で作成してください。件数の表示は採点しません。"
reference = '''
CREATE TABLE customer_u AS (
    WITH sales_amount AS (
        SELECT c.customer_id, c.customer_name, c.postal_cd, COALESCE(SUM(r.amount), 0) AS sum_amount
        FROM customer c LEFT JOIN receipt r ON c.customer_id = r.customer_id
        GROUP BY c.customer_id, c.customer_name, c.postal_cd
    ),
    sales_ranking AS (
        SELECT *, ROW_NUMBER() OVER (PARTITION BY customer_name, postal_cd ORDER BY sum_amount DESC, customer_id) AS ranking
        FROM sales_amount
    )
    SELECT c.* FROM customer c JOIN sales_ranking r ON c.customer_id = r.customer_id AND r.ranking = 1
)
'''
