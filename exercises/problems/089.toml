[sql]
strategy = "custom"
writable = true
artifacts = [
    'customer_train',
    'customer_test',
]
validator = "train_test_split"
validator_params = { test_ratio = 0.2 }
note = "学習用データをテーブル customer_train、テスト用データを customer_test にしてください（顧客データの全項目）。乱数を使うため、重なりがないこと・合わせると売上実績のある顧客全体になること・テスト用が約20%であることを確かめます。"
reference = 'SELECT c.* FROM customer c WHERE c.customer_id IN (SELECT customer_id FROM receipt GROUP BY customer_id HAVING SUM(amount) > 0)'
