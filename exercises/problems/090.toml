note = "6か月ずつずらした3セットを、テーブル series_data_1〜series_data_3 にしてください。各テーブルは年月（YYYYMM の文字列）・売上金額合計・テスト用フラグ（学習0/テスト1）の3列で18か月分です（列名は問いません）。"
reference = '''
CREATE TEMP TABLE ts_amount AS (
    SELECT SUBSTR(CAST(sales_ymd AS VARCHAR), 1, 6) AS sales_ym, SUM(amount) AS sum_amount,
        ROW_NUMBER() OVER (ORDER BY SUBSTR(CAST(sales_ymd AS VARCHAR), 1, 6)) AS rn
    FROM receipt GROUP BY sales_ym
);
CREATE TABLE series_data_1 AS (
    SELECT sales_ym, sum_amount, CASE WHEN rn <= 12 THEN 0 ELSE 1 END AS test_flg FROM ts_amount WHERE rn BETWEEN 1 AND 18
);
CREATE TABLE series_data_2 AS (
    SELECT sales_ym, sum_amount, CASE WHEN rn - 6 <= 12 THEN 0 ELSE 1 END AS test_flg FROM ts_amount WHERE rn - 6 BETWEEN 1 AND 18
);
CREATE TABLE series_data_3 AS (
    SELECT sales_ym, sum_amount, CASE WHEN rn - 12 <= 12 THEN 0 ELSE 1 END AS test_flg FROM ts_amount WHERE rn - 12 BETWEEN 1 AND 18
)
'''
