note = "抽出したデータをテーブル down_sampling にしてください（customer_id 列を含めること。一時テーブルでも可）。乱数を使うため、売上実績あり/なしが1:1で、件数が少ない方の顧客は全件含まれていることを確かめます。"
reference = 'SELECT c.customer_id, CASE WHEN EXISTS (SELECT 1 FROM receipt r WHERE r.customer_id = c.customer_id) THEN 1 ELSE 0 END AS is_buy FROM customer c'
