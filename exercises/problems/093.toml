[sql]
strategy = "table"
rows = "unordered"
column_order = false
writable = true
artifacts = [
    'product_full',
]
note = "作成した商品データをテーブル product_full にしてください。商品データの全項目とカテゴリ大・中・小区分名の列（列名はカテゴリデータと同じ）で作成してください。列の順序は問いません。"
reference = '''
CREATE TABLE product_full AS (
    SELECT
        p.product_cd, p.category_major_cd, c.category_major_name, p.category_medium_cd, c.category_medium_name,
        p.category_small_cd, c.category_small_name, p.unit_price, p.unit_cost
    FROM product p JOIN category c USING (category_small_cd)
)
'''
