# P-097 / S-097: 094で出力したCSV・ヘッダ有り・UTF-8のファイルを読み込み3件表示
id = "097"
status = "verified"

[python]
strategy = "table"
rows = "subset_n"
n = 3
note = "コード値（category_*_cd）のゼロ埋めが保たれるよう、型を指定して読み込んでください。"
setup_note = "094 の模範解答で出力したファイル ./data/P_df_product_full_UTF-8_header.csv（CSV・ヘッダ有り・UTF-8）を用意済みです（../data/P_df_product_full_UTF-8_header.csv でも読めます）。"
setup = '''
df_product_full = pd.merge(
    df_product,
    df_category[["category_small_cd", "category_major_name", "category_medium_name", "category_small_name"]],
    how="inner",
    on="category_small_cd",
)
df_product_full.to_csv("data/P_df_product_full_UTF-8_header.csv", encoding="UTF-8", index=False)
del df_product_full
'''
reference = 'pd.read_csv("data/P_df_product_full_UTF-8_header.csv", dtype={"category_major_cd": str, "category_medium_cd": str, "category_small_cd": str}, encoding="UTF-8")'

[sql]
strategy = "table"
rows = "subset_n"
n = 3
writable = true
note = "このアプリでは安全のため、DBサーバー上のファイルは読めません。テーブルを作成したあと COPY product_full FROM STDIN WITH ... と書くと、094 で出力したファイル（CSV・ヘッダ有り・UTF-8、模範解答）の内容が読み込まれます。"
setup_note = "094 の模範解答の出力（CSV・ヘッダ有り・UTF-8）を、COPY ... FROM STDIN で読み込めるよう用意済みです。"
setup = '''
CREATE TABLE product_full_src AS (
    SELECT
        p.product_cd, p.category_major_cd, c.category_major_name, p.category_medium_cd, c.category_medium_name,
        p.category_small_cd, c.category_small_name, p.unit_price, p.unit_cost
    FROM product p JOIN category c USING (category_small_cd)
)
'''
stdin_query = '''
COPY product_full_src TO STDOUT WITH CSV HEADER ENCODING 'UTF-8'
'''
reference = 'SELECT * FROM product_full_src'
