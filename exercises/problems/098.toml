[sql]
strategy = "table"
rows = "subset_n"
n = 3
writable = true
note = "このアプリでは安全のため、DBサーバー上のファイルは読めません。テーブルを作成したあと COPY product_full FROM STDIN WITH ... と書くと、096 で出力したファイル（CSV・ヘッダ無し・UTF-8、模範解答）の内容が読み込まれます。"
setup_note = "096 の模範解答の出力（CSV・ヘッダ無し・UTF-8）を、COPY ... FROM STDIN で読み込めるよう用意済みです。"
setup = '''
CREATE TABLE product_full_src AS (
    SELECT
        p.product_cd, p.category_major_cd, c.category_major_name, p.category_medium_cd, c.category_medium_name,
        p.category_small_cd, c.category_small_name, p.unit_price, p.unit_cost
    FROM product p JOIN category c USING (category_small_cd)
)
'''
stdin_query = '''
COPY product_full_src TO STDOUT WITH CSV ENCODING 'UTF-8'
'''
reference = 'SELECT * FROM product_full_src'
