[project]
name = "ds100knocksmate"
version = "0.0.1"
description = "DS100KnocksMate: データサイエンス100本ノック（構造化データ加工編）をローカルで解いて採点・進捗保存する学習アプリ（非公式）"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
app = [
    "psycopg[binary]==3.3.6",
    "sqlparse==0.6.0",
    "streamlit==1.66.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
e2e = [
    "playwright==1.64.1",
]
worker = [
    "imbalanced-learn==0.14.2",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "python-dateutil==2.9.0.post0",
    "scikit-learn==1.9.1",
]

[tool.uv]
package = false
default-groups = ["dev", "worker", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: Docker/PostgreSQL等の外部環境が必要なテスト",
    "e2e: 実ブラウザ（Playwright）で起動中のアプリを操作するテスト",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["upstream"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # 行長はformatterに任せる（全角文字を幅2として数えるため）
